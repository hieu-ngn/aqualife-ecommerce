<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../image/icon.img/logo_web.png" type="image/png" />
  <title>Thanh toán - Aqualife</title>
  <link rel="stylesheet" href="../css/base.css" />
  <script defer src="../js/common.js"></script>
  <script defer src="../js/pay.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="home.html">Aqualife</a>
      <nav class="main-nav">
        <a href="home.html">Trang chủ</a>
        <a href="about.html">Về chúng tôi</a>
        <a href="products.html">Sản phẩm</a>
        <a href="contact.html">Liên hệ</a>
      </nav>
      <nav>
        <a class="cart-link" href="auth.html">Đăng nhập <img src="../image/icon.img/auth.png" alt="Đăng nhập"
            class="nav-icon"></a>
        <a class="cart-link cart-link--cart" href="cart.html">Giỏ hàng <img src="../image/icon.img/cart.png"
            alt="Giỏ hàng" class="nav-icon"> <span class="badge" data-cart-count>0</span></a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="checkout-section">
      <div class="container checkout-grid">

        <div class="checkout-form card">
          <h2>Thông tin khách hàng</h2>
          <form id="checkout-form">
            <div class="field-grid">
              <div class="field-group">
                <label for="last-name">Họ</label>
                <input id="last-name" class="input" type="text" placeholder="Nhập họ" />
              </div>
              <div class="field-group">
                <label for="first-name">Tên</label>
                <input id="first-name" class="input" type="text" placeholder="Nhập tên" />
              </div>
            </div>

            <div class="field-group">
              <label for="address">Địa chỉ</label>
              <input id="address" class="input" type="text" placeholder="Nhập địa chỉ" />
            </div>

            <div class="field-grid">
              <div class="field-group">
                <label for="province">Tỉnh</label>
                <input id="province" class="input" type="text" placeholder="Nhập tỉnh" />
              </div>
              <div class="field-group">
                <label for="phone">Số điện thoại</label>
                <input id="phone" class="input" type="tel" placeholder="Nhập số điện thoại" />
              </div>
            </div>

            <div class="field-group">
              <label for="email">Email</label>
              <input id="email" class="input" type="email" placeholder="Nhập email" />
            </div>

            <div class="field-group">
              <label for="notes">Ghi chú bổ sung</label>
              <textarea id="notes" class="textarea" rows="4" placeholder="Ghi chú (không bắt buộc)"></textarea>
            </div>
          </form>
        </div>

        <aside class="checkout-summary card">
          <h2>Thông tin đơn hàng</h2>
          <div id="order-list" class="order-list"></div>

          <div class="field-group">
            <label style="font-weight:600;margin-bottom:4px;">Phương thức vận chuyển</label>
            <div class="shipping-options">
              <label class="shipping-card selected" id="shipping-card-standard">
                <input type="radio" name="shipping_method" value="standard" checked />
                <div class="shipping-card-content">
                  <div class="shipping-card-header">
                    <span>🚚 Giao hàng Tiêu chuẩn</span>
                    <span class="shipping-card-price" id="shipping-price-standard">30.000 ₫</span>
                  </div>
                  <div class="shipping-card-desc">Giao 2–3 ngày • Miễn phí cho đơn từ 500.000 ₫</div>
                </div>
              </label>

              <label class="shipping-card" id="shipping-card-express">
                <input type="radio" name="shipping_method" value="express" />
                <div class="shipping-card-content">
                  <div class="shipping-card-header">
                    <span>⚡ Giao hàng Hỏa tốc</span>
                    <span class="shipping-card-price">50.000 ₫</span>
                  </div>
                  <div class="shipping-card-desc">Giao nhanh trong 2–4 giờ • Đóng thùng xốp oxy chuyên dụng</div>
                </div>
              </label>
            </div>
          </div>

          <div class="voucher-section">
            <label style="font-weight:600;font-size:13px;display:block;margin-bottom:6px;color:#0369a1;">
              🎟️ Mã giảm giá / Voucher
            </label>
            <div class="voucher-input-group">
              <input id="voucher-input" class="input" type="text" placeholder="Nhập mã voucher (vd: AQUALIFE10)" />
              <button id="btn-apply-voucher" class="btn btn-secondary" type="button" style="white-space:nowrap;padding:8px 14px;">Áp dụng</button>
            </div>

            <div id="voucher-chips-container" class="voucher-chips">
              <!-- Gợi ý voucher tải động từ API -->
            </div>

            <div id="voucher-applied-box" class="voucher-applied-box hidden">
              <div>
                <span id="voucher-applied-code" style="font-weight:700;"></span>:
                <span id="voucher-applied-text"></span>
              </div>
              <button id="btn-remove-voucher" class="voucher-remove-btn" type="button" title="Gỡ mã giảm giá">✕ Gỡ</button>
            </div>
            <div id="voucher-feedback" class="alert hidden" style="margin-top:8px;padding:8px 10px;font-size:12px;"></div>
          </div>

          <div class="order-breakdown">
            <div class="breakdown-row">
              <span>Tạm tính hàng:</span>
              <span id="summary-subtotal">0 ₫</span>
            </div>
            <div class="breakdown-row">
              <span>Phí vận chuyển:</span>
              <span id="summary-shipping">30.000 ₫</span>
            </div>
            <div id="breakdown-discount-row" class="breakdown-row discount-row hidden">
              <span>Giảm giá voucher:</span>
              <span id="summary-discount">-0 ₫</span>
            </div>
          </div>

          <div class="order-total" style="margin-bottom:16px;">
            <span>Tổng thanh toán</span>
            <strong id="order-total" style="color:var(--primary-dark);">0 ₫</strong>
          </div>

          <div class="field-group">
            <label style="font-weight:600;">Phương thức thanh toán</label>
            <div class="payment-options">
              <label><input type="radio" name="payment" value="cash" checked /> Tiền mặt (COD)</label>
              <label><input type="radio" name="payment" value="transfer" /> Chuyển khoản VietQR</label>
            </div>
          </div>

          <div id="vietqr-box" class="hidden" style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px;margin-bottom:14px;text-align:center;">
            <p style="margin:0 0 8px 0;font-weight:700;color:#0369a1;font-size:0.92rem;">Quét mã VietQR tự động điền số tiền</p>
            <img id="vietqr-img" src="" alt="Mã VietQR thanh toán Aqualife" style="max-width:210px;width:100%;border-radius:8px;border:1px solid #e2e8f0;background:#fff;" />
            <p id="vietqr-note" class="muted" style="margin:6px 0 0 0;font-size:0.84rem;"></p>
          </div>

          <button id="place-order" class="btn btn-primary" type="button" style="width:100%;padding:12px;font-size:16px;font-weight:700;">Đặt hàng ngay</button>
          <div id="order-feedback" class="alert hidden"></div>
        </aside>

      </div>
    </section>
  </main>

  <footer class="footer footer-minimal">
    <div class="footer-container">
        <div class="footer-bottom">© 2026 Aqualife | <a href="policy.html#muc-05">Điều khoản</a> | <a href="policy.html#muc-04">Chính sách bảo mật</a></div>
    </div>
  </footer>
</body>

</html>
